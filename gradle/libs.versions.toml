[versions]

checker-framework = "4.2.1"

jacoco = "0.8.15"

junit-jupiter = "6.1.2"

pmd = "7.26.0"

[libraries]

# Not a dependency; declared so that the Checker Framework version is tracked like every other
# version.  The org.checkerframework Gradle plugin adds the dependency, from `checkerFramework.version`.
checker-framework = { module = "org.checkerframework:checker", version.ref = "checker-framework" }

error-prone-core = "com.google.errorprone:error_prone_core:2.50.0"

hashmap-util = "org.plumelib:hashmap-util:2.0.0"

# Not a dependency; only its version is read, for the JaCoCo plugin's `toolVersion`.
jacoco = { group = "org.jacoco", name = "org.jacoco.core", version.ref = "jacoco" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }

junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-jupiter" }

# Not a dependency; declared so that the PMD tool version is tracked like every other version.
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }

reflection-util = "org.plumelib:reflection-util:2.0.0"

require-javadoc = "org.plumelib:require-javadoc:3.0.0"

[plugins]

com-diffplug-spotless = { id = "com.diffplug.spotless", version = "8.9.0" }

com-gradleup-shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

com-vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }

net-ltgt-errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }

org-checkerframework = { id = "org.checkerframework", version = "1.0.2" }
