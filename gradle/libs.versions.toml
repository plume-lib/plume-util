[plugins]

com-diffplug-spotless = { id = "com.diffplug.spotless", version = "8.8.0" }

com-gradleup-shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

com-vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }

net-ltgt-errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }

org-checkerframework = { id = "org.checkerframework", version = "1.0.2" }

[versions]

junit-jupiter = "6.1.2"

[libraries]

checker-framework = "org.checkerframework:checker:4.2.1"

error-prone-core = "com.google.errorprone:error_prone_core:2.50.0"

hashmap-util = "org.plumelib:hashmap-util:2.0.0-SNAPSHOT"

# Not used as a dependency; only its version is read, for the JaCoCo plugin's
# `toolVersion`.  Pinning the version matters because the tests run under every
# Java version of the continuous integration matrix, and the JaCoCo agent must
# support the newest of those Java versions.
jacoco = "org.jacoco:org.jacoco.core:0.8.15"

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }

junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Not used as a dependency; only its version is read, for the PMD plugin's
# `toolVersion`.  This is a library rather than a `[versions]` entry so that
# dependency-update tools recognize it and propose new versions of it.
pmd = "net.sourceforge.pmd:pmd-java:7.26.0"

reflection-util = "org.plumelib:reflection-util:2.0.0-SNAPSHOT"

require-javadoc = "org.plumelib:require-javadoc:3.0.0-SNAPSHOT"
