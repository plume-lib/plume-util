plugins {
  id("java-library")

  // Creates the fat jar build/libs/...-all.jar as part of "assemble".
  // To create only that jar, run: ./gradlew shadowJar
  alias(libs.plugins.com.gradleup.shadow)

  // Code formatting; defines targets "spotlessApply" and "spotlessCheck"
  // which are run by "check" (which is itself run by "build").
  alias(libs.plugins.com.diffplug.spotless)

  // Error Prone linter
  alias(libs.plugins.net.ltgt.errorprone)

  // PMD linter
  id("pmd")

  // Code coverage
  id("jacoco")

  // Checker Framework pluggable type-checking
  alias(libs.plugins.org.checkerframework)

  // Publishing to Maven Central
  alias(libs.plugins.com.vanniktech.maven.publish)
}

repositories {
  // mavenLocal() comes first so that a locally-installed snapshot of a dependency takes
  // precedence.  Restricting this to snapshots prevents a stale locally-installed non-snapshot
  // release from shadowing the one on Maven Central.  One consequence is that a locally-installed
  // *release* build of a dependency is ignored; to build against such a build, either temporarily
  // remove "snapshotsOnly()" or install the build as a snapshot.
  mavenLocal {
    mavenContent {
      snapshotsOnly()
    }
  }
  mavenCentral()
  maven {
    url = "https://central.sonatype.com/repository/maven-snapshots/"
    mavenContent {
      snapshotsOnly()
    }
  }
}

dependencies {
  implementation(libs.hashmap.util)
  implementation(libs.reflection.util)
  // Including error_prone_annotations leads to javac warnings (not errors, but
  // annoying nonetheless) when a client of this library doesn't itself depend on
  // error_prone_annotations.  (Even if the dependency is "compileOnly".)
  // implementation("com.google.errorprone:error_prone_annotations")

  testImplementation(libs.junit.jupiter)
  testRuntimeOnly(libs.junit.platform.launcher)
}


// Compilation

java {
  toolchain {
    // Always compile using Java 21.  The "test" task below overrides this for
    // test execution, so that tests run under various Java versions.
    languageVersion = JavaLanguageVersion.of(21)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17

  // Gradle compiles in a worker process whenever the toolchain above differs
  // from the JVM that runs Gradle.  That worker does not inherit the
  // `org.gradle.jvmargs` heap setting in gradle.properties, so set it here too.
  options.forkOptions.jvmArgs += "-Xmx6g"
  options.compilerArgs += "-Werror"
  // "-processing" avoids javac warning "No processor claimed any of these annotations".
  options.compilerArgs += "-Xlint:all,-processing,-this-escape"
}


// Testing

// Compilation always uses Java 21, but the tests run under various Java versions.  The
// `java.toolchain` setting above applies to Test tasks as well as to compilation, so without this
// the tests would always run under Java 21.  By default the tests run under the JVM that Gradle
// itself is running under, which is what the job matrix in .github/workflows/gradle.yml varies.
// Override with, for example:
//   ./gradlew test -PtestJavaVersion=17
def testJavaVersionProperty = project.findProperty("testJavaVersion")
// Compare to null rather than writing `?:`, which would also treat the empty string as absent.
// `./gradlew test -PtestJavaVersion` (no "=" and no value) supplies the empty string, and silently
// testing under the default version is not what someone who wrote that on the command line meant.
def testJavaVersion = JavaLanguageVersion.of(
    (testJavaVersionProperty != null
    ? testJavaVersionProperty
    : JavaVersion.current().majorVersion).toString())

tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = testJavaVersion
  }

  useJUnitPlatform {
    includeEngines("junit-jupiter")
    excludeEngines("junit-vintage")
  }

  // Always re-run the tests, so that their output always appears.  Both lines
  // are needed:  "upToDateWhen" alone would still permit the build cache to
  // supply the outputs of a previous run.
  outputs.upToDateWhen { false }
  outputs.cacheIf { false }

  testLogging {
    // `showStandardStreams = true` would be a redundant way to say the same
    // thing as including the "standardOut" and "standardError" events here.
    events("skipped", "failed", "standardOut", "standardError")
    exceptionFormat = "full"
  }

  // Generate the coverage report after the tests run.
  finalizedBy(tasks.named("jacocoTestReport"))
}

jacoco {
  toolVersion = libs.versions.jacoco.get()
}

tasks.named("jacocoTestReport") {
  reports {
    xml.required = false
    csv.required = true // Output is written to build/reports/jacoco/test/jacocoTestReport.csv
    html.required = true // Output is written to build/reports/jacoco/test/html/index.html
  }
}


// Code formatting

// The directory in which Spotless caches the Groovy-Eclipse formatter that it provisions from P2
// repositories.  Naming the directory, rather than accepting Spotless's default, keeps the
// location stable: the default has moved between Spotless versions and is not documented as being
// stable.  .github/workflows/gradle.yml caches this directory, because downloading its ~140 MB of
// contents intermittently fails with "Failed to provision P2 dependencies".
def spotlessP2CacheDir = new File(gradle.gradleUserHomeDir, "spotless-p2")

// Solstice, which provisions that cache for Spotless, guards it with a lock file that holds the
// owning process's PID.  A build that is killed while provisioning -- by control-C, or by a
// continuous integration job that times out -- leaves the lock file behind.  Solstice never checks
// whether the process that the lock file names still exists, so every later build waits for the
// timeout and then fails with "Failed to provision P2 dependencies"; deleting the lock file by
// hand is the only recovery.  A lock file can even reach a fresh machine, since the cache that
// .github/workflows/gradle.yml saves includes whatever the job left in this directory.
//
// This is a static method of a class rather than a method of the build script, because the
// configuration cache nulls out a closure's owner when it serializes the closure.
class SpotlessP2 {

  // How old a lock file that holds no PID must be before it is treated as abandoned rather than as
  // one whose owner has not yet written its PID.
  private static final long EMPTY_LOCK_FILE_GRACE_MILLIS = 60000

  static void deleteStaleLockFile(File cacheDirectory, Logger logger) {
    File lockFile = new File(new File(cacheDirectory, "metadata"), ".lock")
    if (!lockFile.isFile()) {
      return
    }
    long pid
    try {
      pid = Long.parseLong(lockFile.getText("UTF-8").trim())
    } catch (NumberFormatException e) {
      // Solstice creates the lock file and then writes its PID into it, so a lock file that holds
      // no PID usually belongs to a live process that is between those two steps.  A process that
      // is killed between them leaves the file empty forever, and Solstice parses the file outside
      // the "try" block that handles a lock it cannot take, so every later build then dies with a
      // NumberFormatException.  Wait out the race before assuming that this is the latter case.
      if (System.currentTimeMillis() - lockFile.lastModified() > EMPTY_LOCK_FILE_GRACE_MILLIS
          && lockFile.delete()) {
        logger.lifecycle("Deleted abandoned Spotless P2 lock file that holds no PID: ${lockFile}")
      }
      return
    }
    // A PID that the operating system has recycled looks like the original owner, which leaves the
    // lock file in place.  That is the behavior that this method is avoiding, but erring in this
    // direction merely fails to improve on Solstice, whereas deleting a live process's lock file
    // would let two processes write the cache at once.
    if (ProcessHandle.of(pid).isPresent()) {
      return
    }
    if (lockFile.delete()) {
      logger.lifecycle("Deleted stale Spotless P2 lock file of dead process ${pid}: ${lockFile}")
    }
  }
}

// A separate task rather than a "doFirst" action on the Spotless task itself:  Spotless provisions
// the formatter while Gradle fingerprints that task's inputs, which happens before any of its
// actions run, so a "doFirst" action would run too late to help.  A dependency runs to completion
// before the fingerprinting does.
//
// The task declares no outputs, so it always runs.  That costs one "stat" of a file that usually
// does not exist.
def deleteStaleSpotlessP2Lock = tasks.register("deleteStaleSpotlessP2Lock") {
  description = "Delete the Spotless P2 lock file if the process that holds it is gone."
  def cacheDirectory = spotlessP2CacheDir
  doLast {
    SpotlessP2.deleteStaleLockFile(cacheDirectory, logger)
  }
}

// "spotlessGroovyGradle" is the task that provisions and runs the formatter; "...Check" and
// "...Apply" depend on it.  Matching by prefix covers all three, in case that ever changes.
tasks.matching { it.name.startsWith("spotlessGroovyGradle") }.configureEach {
  dependsOn(deleteStaleSpotlessP2Lock)
}

spotless {
  java {
    googleJavaFormat(libs.versions.google.java.format.get())
    formatAnnotations()
  }
  groovyGradle {
    target("**/*.gradle")

    def greclipseConfig = greclipse(libs.versions.greclipse.get())
    greclipseConfig.cacheDirectory(spotlessP2CacheDir)
    greclipseConfig.withP2Mirrors([
      "https://download.eclipse.org/": "https://mirror.umd.edu/eclipse/",
      // Not a no-op:  as soon as the mirror map is non-empty, Spotless rewrites every P2 repository
      // URL through it and throws IllegalStateException for a URL that matches no prefix, rather
      // than leaving that URL alone.  This identity entry is what lets the Groovy repository keep
      // its own address.
      "https://groovy.jfrog.io/": "https://groovy.jfrog.io/",
    ])

    leadingTabsToSpaces(2)
    trimTrailingWhitespace()
    // endWithNewline() // Don't want to end empty files with a newline
  }
}


// Error Prone linter

dependencies {
  errorprone(libs.error.prone.core)
}

tasks.withType(JavaCompile).configureEach {
  options.errorprone {
    disable("AnnotateFormatMethod") // Error Prone doesn't know about Checker Framework @FormatMethod.
    disable("DoNotCallSuggester") // Suggests use of an Error Prone annotation.
    disable("EffectivelyPrivate") // Loses information about the abstraction.
    disable("ExtendsObject") // Incorrect when using the Checker Framework.
    disable("InlineMeSuggester") // Using `@InlineMe` requires clients to declare a dependency on error_prone_annotations.
    disable("ReferenceEquality") // Use Interning Checker instead.
  }
}


// PMD linter

pmd {
  toolVersion = libs.versions.pmd.get()
  ruleSets = [] // Prevent the default errorprone.xml from being applied.
  ruleSetFiles = files("${rootDir}/.pmd-ruleset.xml")
  consoleOutput = true
}


// Checker Framework pluggable type-checking

checkerFramework {
  version = libs.versions.checker.framework.get()
  checkers = [
    // No need to run CalledMethodsChecker, because ResourceLeakChecker does so.
    // "org.checkerframework.checker.calledmethods.CalledMethodsChecker",
    "org.checkerframework.checker.formatter.FormatterChecker",
    "org.checkerframework.checker.index.IndexChecker",
    "org.checkerframework.checker.interning.InterningChecker",
    "org.checkerframework.checker.lock.LockChecker",
    "org.checkerframework.checker.nullness.NullnessChecker",
    "org.checkerframework.checker.regex.RegexChecker",
    "org.checkerframework.checker.resourceleak.ResourceLeakChecker",
    "org.checkerframework.checker.signature.SignatureChecker",
    "org.checkerframework.checker.signedness.SignednessChecker",
    "org.checkerframework.common.initializedfields.InitializedFieldsChecker",
  ]
  extraJavacArgs = [
    "-Werror",
    // "-Aversion",
    // "-verbose",
    "-AcheckPurityAnnotations",
    "-ArequirePrefixInWarningSuppressions",
    "-AwarnRedundantAnnotations",
    "-AwarnUnneededSuppressions",
  ]
}


// Javadoc

// Javadoc generates a CSS import of a font that is not distributed alongside
// the documentation, so remove the import.  Cannot use "ant.replaceregexp",
// because the Ant builder is reachable only through the "Project" object, which
// the configuration cache forbids a task action from using.
//
// This is a static method of a class rather than a method of the build script,
// because the configuration cache nulls out a closure's owner when it serializes
// the closure.
class JavadocFonts {
  static void removeDejaVuFontImport(File javadocDir) {
    if (!javadocDir.isDirectory()) {
      return
    }
    javadocDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
      if (!(file.name.endsWith(".css") || file.name.endsWith(".html"))) {
        return
      }
      String contents = file.getText("UTF-8")
      String newContents =
          contents.replaceAll(/@import url\('(?:resources\/)?fonts\/dejavu\.css'\);[ \t]*/, "")
      if (newContents != contents) {
        file.setText(newContents, "UTF-8")
      }
    }
  }
}

tasks.withType(Javadoc).configureEach {
  options.noTimestamp = true
  options.quiet()
  doLast {
    JavadocFonts.removeDejaVuFontImport(it.destinationDir)
  }
}

// Turns Javadoc warnings into errors.  This is applied to individual tasks rather than to every
// Javadoc task, because a task that uses a custom doclet rejects the standard doclet's options.
def strictJavadoc = { Javadoc javadocTask ->
  javadocTask.options.addBooleanOption("Xdoclint:all", true)
  javadocTask.options.addBooleanOption("Xwerror", true)
}

tasks.named("javadoc", Javadoc) {
  strictJavadoc(it)
}

// The `javadoc` task documents only the public API.
// `javadocPrivate` applies the same doclint checks to private members.
def javadocPrivate = tasks.register("javadocPrivate", Javadoc) {
  description = "Generate Javadoc for all members, including private ones."
  source = sourceSets.main.allJava
  classpath = sourceSets.main.output + sourceSets.main.compileClasspath
  destinationDir = layout.buildDirectory.dir("docs/javadocPrivate").get().asFile
  options.addBooleanOption("private", true)
  strictJavadoc(it)
}
tasks.named("check") {
  dependsOn("javadoc", javadocPrivate)
}

def javadocWebUpload = tasks.register("javadocWebUpload", Javadoc) {
  description = "Write API documentation to the website directory."
  source = sourceSets.main.allJava
  classpath = sourceSets.main.output + sourceSets.main.compileClasspath
  destinationDir = file("/cse/web/research/plumelib/${project.name}/api")
  strictJavadoc(it)
}
// Set permissions
def javadocWebChgrp = tasks.register("javadocWebChgrp", Exec) {
  description = "Set the Unix group of the website's API documentation."
  mustRunAfter(javadocWebUpload)
  commandLine("chgrp", "-R", "plse_www", "/cse/web/research/plumelib/${project.name}/api")
  // A file that another user owns cannot be chgrped, which is not worth failing the build over.
  ignoreExitValue = true
  doLast {
    int exitValue = executionResult.get().exitValue
    if (exitValue != 0) {
      logger.warn("chgrp of the uploaded API documentation exited with status ${exitValue}.")
    }
  }
}
def javadocWebChmod = tasks.register("javadocWebChmod", Exec) {
  description = "Set the Unix permissions of the website's API documentation."
  mustRunAfter(javadocWebUpload)
  commandLine("chmod", "-R", "g+w", "/cse/web/research/plumelib/${project.name}/api")
  // A file that another user owns cannot be chmoded, which is not worth failing the build over.
  ignoreExitValue = true
  doLast {
    int exitValue = executionResult.get().exitValue
    if (exitValue != 0) {
      logger.warn("chmod of the uploaded API documentation exited with status ${exitValue}.")
    }
  }
}
// The three tasks above are steps of "javadocWeb", so they have no group and thus do not appear in
// the output of `./gradlew tasks`.
tasks.register("javadocWeb", DefaultTask) {
  group = "documentation"
  description = "Upload API documentation to website."
  dependsOn(javadocWebUpload, javadocWebChgrp, javadocWebChmod)
}


// RequireJavadoc calls javac internals, which the jdk.compiler module does not export.
def javacInternalPackages = [
  "file",
  "parser",
  "tree",
  "util"
]
def addExportsArgs = javacInternalPackages.collect {
  "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString()
}
def addOpensArgs = javacInternalPackages.collect {
  "--add-opens=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString()
}

// `resolvable` rather than the `configurations { requireJavadoc }` shorthand, which creates a
// configuration that is both resolvable and consumable and that Gradle reports as legacy.
configurations.resolvable("requireJavadoc")
dependencies {
  requireJavadoc(libs.require.javadoc)
}
// RequireJavadoc produces no output of its own, so write a marker file.  Without a declared output,
// the task could never be up to date and the declared inputs would have no effect.
def requireJavadocMarker = layout.buildDirectory.file("requireJavadoc/requireJavadoc.txt")
def requireJavadoc = tasks.register("requireJavadoc", JavaExec) {
  group = "documentation"
  description = "Ensures that Javadoc documentation exists."
  inputs.files(sourceSets.main.allJava)
  outputs.file(requireJavadocMarker)
  mainClass = "org.plumelib.javadoc.RequireJavadoc"
  classpath = configurations.requireJavadoc
  args(sourceSets.main.allJava.srcDirs.collect { it.absolutePath })
  jvmArgs += addExportsArgs
  jvmArgs += addOpensArgs
  // Runs only if the tool found no problems, so that a failure does not leave behind a marker file
  // that would mark this task up to date.
  doLast {
    File marker = requireJavadocMarker.get().asFile
    marker.parentFile.mkdirs()
    marker.text = ""
  }
}
tasks.named("check") {
  dependsOn(requireJavadoc)
}
// On javadocWebUpload rather than on javadocWeb, so that the check runs *before* the upload.  A
// dependency of javadocWeb would be unordered with respect to javadocWebUpload.
javadocWebUpload.configure {
  dependsOn(requireJavadoc)
}


// Publishing, see README-developers.md

// The fat jar is attached to GitHub releases, not published to Maven Central,
// so keep the `shadowRuntimeElements` variant out of the Gradle module metadata.
shadow {
  addShadowVariantIntoJavaComponent = false
}

// Make the published archives byte-for-byte reproducible.
tasks.withType(AbstractArchiveTask).configureEach {
  preserveFileTimestamps = false
  reproducibleFileOrder = true
}

mavenPublishing {
  coordinates("org.plumelib", project.name, project.version)

  pom {
    name = "Plume Util"
    description = "Utility libraries for Java.  Complements Guava, Apache Commons, Eclipse Collections, etc."
    url = "https://github.com/plume-lib/${project.name}"

    scm {
      url = "https://github.com/plume-lib/${project.name}/"
      connection = "scm:git:git://github.com/plume-lib/${project.name}.git"
      developerConnection = "scm:git:ssh://git@github.com/plume-lib/${project.name}.git"
    }

    licenses {
      license {
        name = "MIT License"
        url = "https://opensource.org/licenses/MIT"
      }
    }

    developers {
      developer {
        id = "mernst"
        name = "Michael Ernst"
        email = "mernst@alum.mit.edu"
      }
    }
  }
}


// Emacs support

/* Make Emacs TAGS table */
tasks.register("tags", Exec) {
  group = "IDE"
  description = "Run etags to create an Emacs TAGS table"
  def sourceFiles = fileTree("src") {
    include("**/*.java")
    include("**/*.sh")
  }
  // `projectPath` in a build script is Gradle's project path (such as ":"), not a file system
  // path, so compute the project directory explicitly.
  def projectDirPath = layout.projectDirectory.asFile.toPath()
  inputs.files(sourceFiles)
  outputs.file(layout.projectDirectory.file("TAGS"))
  executable("etags")
  // Compute the arguments when the task runs, not when it is configured.
  argumentProviders.add({
    sourceFiles.files.sort()*.toPath().collect {
      projectDirPath.relativize(it).toString()
    }
  } as CommandLineArgumentProvider)
}


// Debugging support

tasks.register("printCompileClasspaths") {
  group = "help"
  description = "Print the compile-time classpaths"
  // Resolve the classpaths when the task is configured, not when it runs.  Reading `sourceSets`
  // from a task action would capture the `Project` object, which the configuration cache forbids.
  def mainClasspath = sourceSets.main.compileClasspath
  def testClasspath = sourceSets.test.compileClasspath
  doFirst {
    println("Compile classpath:")
    println(mainClasspath.asPath)
    println("Compile test classpath:")
    println(testClasspath.asPath)
  }
}
