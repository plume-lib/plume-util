name: Java CI with Gradle

"on": [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['17', '21', '25', '26']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      # Java 21 is always needed, because compilation always uses Java 21.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            ${{ matrix.java }}
          check-latest: true
          cache: 'gradle'
      - name: java -version
        run: java -version
      - name: Warm up Gradle cache
        run: ./gradlew spotlessCheck > /dev/null 2>&1 || (sleep 60 && true)
      - name: ./gradlew build
        run: ./gradlew build -PtestJavaVersion=${{ matrix.java }}
