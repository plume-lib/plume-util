name: Java CI with Gradle

"on": [push, pull_request]

jobs:

  # Formatting does not depend on the Java version, so Spotless runs in this single job rather than
  # in every job of the "build" matrix below.  Spotless's Groovy-Eclipse formatter downloads about
  # 140MB from Eclipse P2 repositories, and that download fails often enough that performing it once
  # per push rather than once per matrix job noticeably reduces "Failed to provision P2 dependencies"
  # errors.
  spotless:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: 'gradle'
      # Key the cache on just the two versions that determine its contents, rather than on a hash of
      # all of gradle/libs.versions.toml.  A hash of the whole file changes whenever any dependency
      # is upgraded, which would make the cache go cold far more often than the formatter actually
      # changes; the usual remedy for that, "restore-keys", makes the cache grow without bound,
      # because each save then writes back every formatter version that an earlier run downloaded.
      - name: Compute the Spotless P2 cache key
        id: spotless-p2-key
        run: |
          set -eu
          greclipse="$(sed -n 's/^greclipse *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          spotless="$(sed -n 's/^com-diffplug-spotless *=.*version *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          # Each expression must match exactly one line.  No match means that the catalog changed
          # shape, and the key would then not distinguish formatter versions at all.  Two or more
          # matches would make the value multi-line, which silently corrupts the "key=<value>" line
          # below:  $GITHUB_OUTPUT treats each line as a separate assignment.
          if [ -z "$greclipse" ] || [ "$(printf '%s\n' "$greclipse" | wc -l)" -ne 1 ] \
              || [ -z "$spotless" ] || [ "$(printf '%s\n' "$spotless" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one Groovy-Eclipse version and one Spotless version in gradle/libs.versions.toml" >&2
            echo "Groovy-Eclipse: $greclipse" >&2
            echo "Spotless: $spotless" >&2
            exit 1
          fi
          echo "key=spotless-p2-${{ runner.os }}-greclipse-$greclipse-spotless-$spotless" >> "$GITHUB_OUTPUT"
      # The directory is the one that build.gradle passes to `greclipseConfig.cacheDirectory`.  It
      # holds the P2 metadata and every downloaded bundle, so a cache hit means that the Spotless
      # run below makes no network requests to the P2 repositories.
      - name: Restore Spotless P2 cache
        id: restore-spotless-p2
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/spotless-p2
          key: ${{ steps.spotless-p2-key.outputs.key }}
          restore-keys: ${{ steps.spotless-p2-key.outputs.key }}-partial-
      # Solstice, which provisions the cache, guards it with a lock file that it does not always
      # remove when provisioning fails, so a saved entry can contain one.  Solstice never checks
      # whether the process that a lock file names still exists, and on this runner it certainly
      # does not, so a restored lock file would make the run below wait for a timeout and then fail
      # with the very error that the cache exists to avoid.  Nothing else here holds the lock.
      - name: Delete any restored Spotless P2 lock file
        run: rm -f ~/.gradle/spotless-p2/metadata/.lock
      - name: ./gradlew spotlessCheck
        id: spotless-check
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew spotlessCheck --stacktrace 2>&1 | tee "$RUNNER_TEMP/spotless-output.txt"; then
              exit 0
            fi
            if ! grep -q 'Failed to provision P2 dependencies' "$RUNNER_TEMP/spotless-output.txt"; then
              # The failure is a formatting violation or some other real problem, not a failure to
              # download the Groovy-Eclipse formatter.  Retrying would not help.
              exit 1
            fi
            # Nothing follows the last attempt but the failure below, so do not delay it.
            if [ "$attempt" -lt 3 ]; then
              sleep $((30 * attempt))
            fi
          done
          exit 1
      # A cache that a successful run saves is complete, so later runs can use it without any
      # network access.  Saving is skipped after an exact cache hit, because a cache entry that
      # exists cannot be overwritten.
      - name: Save the complete Spotless P2 cache
        if: success() && steps.restore-spotless-p2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/spotless-p2
          key: ${{ steps.spotless-p2-key.outputs.key }}
      # A failed download usually obtained part of the formatter, and caching that makes the next
      # run more likely to succeed.  The key differs from the one above so that a partial cache can
      # never masquerade as a complete one:  it is reachable only through "restore-keys", and the
      # next successful run supersedes it.
      #
      # Nothing is saved if the restore found any entry, exact or partial, because then the cache
      # already holds everything that this run started from.  Testing "cache-hit" alone would cover
      # only the exact entry:  a run that restored a partial entry, downloaded a bit more, and
      # failed again would write yet another ~140MB entry under a fresh key, and nothing ever
      # deletes the earlier ones.  A branch that fails repeatedly would accumulate them.  Entries
      # are evicted least-recently-used once a repository holds 10GB of them, so needless entries
      # push out the Gradle caches that "setup-java" maintains.  The cost of this stricter
      # condition is that a partial entry never grows; the next successful run supersedes it.
      #
      # The condition names the Spotless step rather than relying on "failure()" alone, which is
      # true when any earlier step failed.  If "actions/checkout", "setup-java", or the key
      # computation failed, then the key is empty and the directory below does not exist, and
      # "actions/cache/save" would log a warning and save nothing of use.
      - name: Save a partial Spotless P2 cache
        if: failure() && steps.spotless-check.outcome == 'failure' && steps.restore-spotless-p2.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/spotless-p2
          key: ${{ steps.spotless-p2-key.outputs.key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['17', '21', '25', '26']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # "setup-java" makes the last version listed the default JAVA_HOME, so Gradle itself runs
          # under Java 21 no matter which version this job tests.  When "matrix.java" is 21, the
          # list names 21 twice, which "setup-java" tolerates.
          java-version: |
            ${{ matrix.java }}
            21
          check-latest: true
          cache: 'gradle'
      # `java -version` alone would print 21 in every job, because 21 is the default JAVA_HOME.
      - name: Show the Java versions
        run: |
          echo 'JVM that runs Gradle:'
          java -version
          echo 'JVM that runs the tests:'
          "$JAVA_HOME_${{ matrix.java }}_${{ runner.arch }}/bin/java" -version
      # Gradle does not auto-detect the JDKs that "setup-java" installs, because
      # they are in the tool cache rather than in a standard location.
      # The "spotless" job above performs the formatting checks.
      - name: ./gradlew build
        run: ./gradlew build -x spotlessCheck -PtestJavaVersion=${{ matrix.java }} -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_${{ runner.arch }},JAVA_HOME_21_${{ runner.arch }}
